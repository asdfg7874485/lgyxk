# Render Blueprint 配置 —— 连接 GitHub 仓库后可一键部署
# 文档：https://render.com/docs/blueprint-spec

services:
  - type: web
    name: liangge-youxiku
    runtime: python
    plan: free          # 免费套餐（750小时/月，15分钟无访问休眠）
    region: oregon      # 可选：oregon / frankfurt / singapore
    branch: main        # 你的仓库主分支（可能是 master）
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    # 关键：端口必须读环境变量 PORT，server.py 已支持
    envVars:
      - key: PORT
        value: 3000    # Render 会自动注入真实端口，此处仅作说明
      - key: PYTHON_VERSION
        value: "3.10"
    # 健康检查：Render 据此判断部署是否就绪
    healthCheckPath: /
    autoDeploy: true    # 推送到 GitHub 后自动重新部署
